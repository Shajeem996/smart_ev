{% extends 'base.html' %}

{% block title %}Confirm Delete - System Admin{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border">
            <div class="card-body p-4 text-center">
                <div class="fs-1 text-danger mb-3"><i class="bi bi-trash-fill"></i></div>
                <h4 class="fw-bold text-navy mb-2">Delete {{ type }}?</h4>
                <p class="text-muted small mb-4">
                    Are you sure you want to permanently delete <strong>{{ item }}</strong>? This action cannot be undone.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <button type="button" class="btn btn-outline-secondary px-4" onclick="history.back()">Cancel</button>
                        <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
