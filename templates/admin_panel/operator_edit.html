{% extends 'base.html' %}

{% block title %}Edit Operator - System Admin{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="page-header mb-4">
            <h2 class="page-title text-navy"><i class="bi bi-pencil text-primary me-2"></i> Edit Operator: {{ operator_user.username }}</h2>
            <p class="page-subtitle">Update contact details and change station facility assignment.</p>
        </div>

        <div class="card shadow-sm border">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ operator_user.first_name }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" value="{{ operator_user.username }}" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ operator_user.phone }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reassign Charging Station</label>
                        <select name="station" class="form-select">
                            <option value="">-- Unassigned --</option>
                            {% for s in stations %}
                                <option value="{{ s.id }}" {% if profile.assigned_station_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.city }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="ACTIVE" {% if profile.status == 'ACTIVE' %}selected{% endif %}>Active</option>
                            <option value="INACTIVE" {% if profile.status == 'INACTIVE' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'admin_operators' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-ev-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
