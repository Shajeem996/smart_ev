{% extends 'base.html' %}

{% block title %}Delete Vehicle - Smart EVCharge{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border">
            <div class="card-body p-4 text-center">
                <div class="fs-1 text-danger mb-3"><i class="bi bi-trash-fill"></i></div>
                <h4 class="fw-bold text-navy mb-2">Remove EV Vehicle?</h4>
                <p class="text-muted small mb-4">
                    Are you sure you want to remove <strong>{{ vehicle.model }} ({{ vehicle.vehicle_number }})</strong> from your account?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'vehicle_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
